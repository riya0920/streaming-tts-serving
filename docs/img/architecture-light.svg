<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 336" width="880" height="336">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a998f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker></defs>
<rect x="8" y="96" width="108" height="56" rx="8" fill="#f7f7f5" stroke="#dcdbd5" stroke-width="1"/>
<text x="62" y="120" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#16160f" text-anchor="middle">client</text>
<text x="62" y="138" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="400" fill="#6f6e69" text-anchor="middle">WebSocket</text>
<rect x="150" y="60" width="168" height="128" rx="8" fill="#f7f7f5" stroke="#dcdbd5" stroke-width="1"/>
<text x="234" y="84" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#16160f" text-anchor="middle">Go gateway</text>
<text x="234" y="108" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="400" fill="#6f6e69" text-anchor="middle">session state</text>
<text x="234" y="127" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="400" fill="#6f6e69" text-anchor="middle">admission control</text>
<text x="234" y="146" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="400" fill="#6f6e69" text-anchor="middle">least-in-flight routing</text>
<text x="234" y="165" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="400" fill="#6f6e69" text-anchor="middle">OTel + Prometheus</text>
<rect x="352" y="24" width="424" height="200" rx="10" fill="#f7f7f5" stroke="#dcdbd5" stroke-width="1"/>
<text x="368" y="46" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#16160f" text-anchor="start">Triton</text>
<text x="768" y="46" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="400" fill="#6f6e69" text-anchor="end">one per GPU</text>
<rect x="370" y="62" width="388" height="44" rx="7" fill="#f7f7f5" stroke="#dcdbd5" stroke-width="1"/>
<text x="384" y="81" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#16160f" text-anchor="start">tts_frontend</text>
<text x="384" y="96" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="400" fill="#6f6e69" text-anchor="start">text to token ids</text>
<text x="744" y="81" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="400" fill="#6f6e69" text-anchor="end">python, CPU</text>
<rect x="370" y="122" width="388" height="44" rx="7" fill="#f7f7f5" stroke="#dcdbd5" stroke-width="1"/>
<text x="384" y="141" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#16160f" text-anchor="start">vits_frontend</text>
<text x="384" y="156" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="400" fill="#6f6e69" text-anchor="start">tokens to latents</text>
<text x="744" y="141" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="400" fill="#6f6e69" text-anchor="end">TensorRT, GPU</text>
<rect x="370" y="182" width="388" height="44" rx="7" fill="#f7f7f5" stroke="#dcdbd5" stroke-width="1"/>
<text x="384" y="201" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#16160f" text-anchor="start">tts_stream</text>
<text x="384" y="216" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="400" fill="#6f6e69" text-anchor="start">latents to audio chunks</text>
<text x="744" y="201" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="400" fill="#6f6e69" text-anchor="end">C++, decoupled</text>
<path d="M120,124 L146,124" stroke="#9a998f" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M322,100 L366,84" stroke="#9a998f" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M564,106 L564,118" stroke="#9a998f" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M564,166 L564,178" stroke="#9a998f" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M370,208 L336,208 Q326,208 326,218 L326,250 Q326,260 316,260 L72,260 Q62,260 62,250 L62,158" stroke="#2a78d6" stroke-width="1.5" fill="none" marker-end="url(#b)"/>
<text x="196" y="253" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="400" fill="#2a78d6" text-anchor="middle">audio chunks stream back as they decode</text>
<text x="8" y="300" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#16160f" text-anchor="start">p50 26 ms</text>
<text x="80" y="300" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#6f6e69" text-anchor="start">to the first chunk under 3,200 held sessions.</text>
<text x="8" y="320" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="400" fill="#6f6e69" text-anchor="start">The decoder never waits for the whole utterance: chunk 1 leaves while chunk 4 is still being decoded.</text>
