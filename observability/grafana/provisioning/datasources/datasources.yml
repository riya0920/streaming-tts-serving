apiVersion: 1

datasources:
  # Single-pod deploy: everything is on localhost. On a VM+compose deploy these become
  # the docker-compose service names (prometheus:9090, jaeger:16686).
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    jsonData:
      timeInterval: 5s

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://localhost:16686
